version: "3.9"

services:
    # ----------------------------
    # MySQL Database
    # ----------------------------
    db:
        image: mysql:8.4
        container_name: db
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
                ]
            interval: 5s
            timeout: 3s
            retries: 20
        restart: always
        networks:
            - app_network

    # ----------------------------
    # Redis Cache
    # ----------------------------
    redis:
        image: redis:7
        container_name: redis
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - "6379:6379"
        restart: always
        networks:
            - app_network

    # ----------------------------
    # NestJS API (backend)
    # ----------------------------
    api:
        container_name: api
        build:
            context: .
            dockerfile: ./apps/api/Dockerfile
        env_file:
            - .env # ✅ cargamos variables de entorno desde archivo seguro
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        ports:
            - "${API_PORT}:${API_PORT}"
        restart: always
        networks:
            - app_network

    # ----------------------------
    # Next.js Frontend (web)
    # ----------------------------
    web:
        container_name: web
        build:
            context: .
            dockerfile: ./apps/web/Dockerfile
        env_file:
            - .env
        depends_on:
            api:
                condition: service_started
        ports:
            - "${NEXT_PORT}:${NEXT_PORT}"
        restart: always
        networks:
            - app_network

# ----------------------------
# Volumes & Networks
# ----------------------------
volumes:
    db_data:

networks:
    app_network:
        driver: bridge
